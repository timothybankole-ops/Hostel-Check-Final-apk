name: Build HostelCheck EKSU Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostelcheck-eksu/hostelcheck-eksu
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://hostelcheck-backend.onrender.com

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HostelCheck-EKSU-Android-APK
          path: hostelcheck-eksu/hostelcheck-eksu/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
