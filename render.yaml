databases:
  - name: hostelcheck-db
    plan: free
    databaseName: hostelcheck
    user: hostelcheck

services:
  - type: web
    name: hostelcheck-backend
    runtime: docker
    rootDir: hostelcheck-backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: hostelcheck-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hostelcheck-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hostelcheck-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: hostelcheck-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: hostelcheck-db
          property: password
      - key: ADMIN_API_KEY
        sync: false

  - type: web
    name: hostelcheck-frontend
    runtime: docker
    rootDir: hostelcheck-eksu/hostelcheck-eksu
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
