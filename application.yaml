spring:
  application:
    name: hostelcheck-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hostelcheck}
    username: ${DB_USERNAME:hostelcheck}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
server:
  port: ${PORT:8080}
app:
  admin-api-key: ${ADMIN_API_KEY:}
